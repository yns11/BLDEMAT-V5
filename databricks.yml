bundle:
  name: bldemat-v5

variables:
  lakebase_branch:
    description: Chemin projects/.../branches/... de la branche Lakebase
  lakebase_database:
    description: Chemin projects/.../branches/.../databases/... de la base Lakebase
  lakebase_endpoint:
    description: Chemin projects/.../branches/.../endpoints/... de l'endpoint Lakebase
  pg_host:
    description: Hôte PostgreSQL Lakebase
  pg_database:
    description: Nom de la base PostgreSQL
    default: databricks_postgres
  pg_schema:
    description: Schéma applicatif PostgreSQL
    default: bl_demat
  documents_volume:
    description: Nom complet catalogue.schema.volume pour les images
  model_endpoint_name:
    description: Endpoint Model Serving vision utilisé pour l'extraction
  jobs_service_principal:
    description: Client ID du service principal qui exécute les jobs
  creation_users_group:
    description: Groupe Databricks autorisé à utiliser l'app Création
  administration_users_group:
    description: Groupe Databricks autorisé à utiliser l'app Administration
  administrators_group:
    description: Groupe Databricks autorisé à gérer les ressources BLDEMAT
  bootstrap_admins:
    description: Emails, séparés par des virgules, autorisés à initialiser le RBAC
  erp_catalog:
    description: Catalogue Unity Catalog contenant les vues ERP
  erp_schema:
    description: Schéma Unity Catalog contenant les vues ERP
  staging_catalog:
    description: Catalogue Unity Catalog du staging historisé
  staging_schema:
    description: Schéma Unity Catalog du staging historisé
  sales_desadv_enabled:
    description: Active l'adaptateur ERP optionnel DESADV vente
    default: "false"

resources:
  apps:
    creation:
      name: bldemat-${bundle.target}-creation
      description: Saisie terrain des bordereaux de livraison
      source_code_path: ./src/app_creation
      compute_size: MEDIUM
      config:
        command: ["streamlit", "run", "app.py", "--server.headless=true"]
        env:
          - name: BL_ENVIRONMENT
            value: ${bundle.target}
          - name: BL_PG_SCHEMA
            value: ${var.pg_schema}
          - name: BL_VOLUME_PATH
            value: /Volumes/${var.documents_volume}
          - name: BL_LLM_ENDPOINT
            value: ${var.model_endpoint_name}
          - name: LAKEBASE_ENDPOINT
            value: ${var.lakebase_endpoint}
          - name: BL_BOOTSTRAP_ADMINS
            value: ${var.bootstrap_admins}
      resources:
        - name: lakebase
          postgres:
            branch: ${var.lakebase_branch}
            database: ${var.lakebase_database}
            permission: CAN_CONNECT_AND_CREATE
        - name: documents
          uc_securable:
            securable_type: VOLUME
            securable_full_name: ${var.documents_volume}
            permission: WRITE_VOLUME
        - name: vision
          serving_endpoint:
            name: ${var.model_endpoint_name}
            permission: CAN_QUERY
      permissions:
        - group_name: ${var.creation_users_group}
          level: CAN_USE
        - group_name: ${var.administrators_group}
          level: CAN_MANAGE

    administration:
      name: bldemat-${bundle.target}-administration
      description: Pilotage et administration métier des BL
      source_code_path: ./src/app_administration
      compute_size: MEDIUM
      config:
        command: ["streamlit", "run", "app.py", "--server.headless=true"]
        env:
          - name: BL_ENVIRONMENT
            value: ${bundle.target}
          - name: BL_PG_SCHEMA
            value: ${var.pg_schema}
          - name: BL_VOLUME_PATH
            value: /Volumes/${var.documents_volume}
          - name: LAKEBASE_ENDPOINT
            value: ${var.lakebase_endpoint}
          - name: BL_BOOTSTRAP_ADMINS
            value: ${var.bootstrap_admins}
      resources:
        - name: lakebase
          postgres:
            branch: ${var.lakebase_branch}
            database: ${var.lakebase_database}
            permission: CAN_CONNECT_AND_CREATE
        - name: documents
          uc_securable:
            securable_type: VOLUME
            securable_full_name: ${var.documents_volume}
            permission: READ_VOLUME
      permissions:
        - group_name: ${var.administration_users_group}
          level: CAN_USE
        - group_name: ${var.administrators_group}
          level: CAN_MANAGE

  jobs:
    sync_referentiels:
      name: bldemat-${bundle.target}-sync-referentiels
      description: Synchronisation historisée ERP vers Lakebase
      run_as:
        service_principal_name: ${var.jobs_service_principal}
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 30 5 * * ?"
        timezone_id: Europe/Paris
        pause_status: UNPAUSED
      tasks:
        - task_key: sync
          spark_python_task:
            python_file: ./jobs/sync_referentiels_erp.py
            parameters:
              - --catalog-erp
              - ${var.erp_catalog}
              - --schema-erp
              - ${var.erp_schema}
              - --catalog-staging
              - ${var.staging_catalog}
              - --schema-staging
              - ${var.staging_schema}
              - --pg-host
              - ${var.pg_host}
              - --pg-database
              - ${var.pg_database}
              - --pg-schema
              - ${var.pg_schema}
              - --lakebase-endpoint
              - ${var.lakebase_endpoint}
              - --pg-user
              - ${var.jobs_service_principal}
              - --sales-desadv-enabled
              - ${var.sales_desadv_enabled}
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "4"
            dependencies:
              - psycopg[binary]==3.2.3
              - databricks-sdk>=0.89.0,<1
      permissions:
        - group_name: ${var.administrators_group}
          level: CAN_MANAGE

    dispatch_notifications:
      name: bldemat-${bundle.target}-dispatch-notifications
      description: Diffusion idempotente des notifications par canal
      run_as:
        service_principal_name: ${var.jobs_service_principal}
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0/15 * * * ?"
        timezone_id: Europe/Paris
        pause_status: UNPAUSED
      tasks:
        - task_key: dispatch
          spark_python_task:
            python_file: ./jobs/dispatch_notifications.py
            parameters:
              - --pg-host
              - ${var.pg_host}
              - --pg-database
              - ${var.pg_database}
              - --pg-schema
              - ${var.pg_schema}
              - --lakebase-endpoint
              - ${var.lakebase_endpoint}
              - --pg-user
              - ${var.jobs_service_principal}
              - --batch-size
              - "100"
              - --max-attempts
              - "8"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "4"
            dependencies:
              - psycopg[binary]==3.2.3
              - databricks-sdk>=0.89.0,<1
      permissions:
        - group_name: ${var.administrators_group}
          level: CAN_MANAGE

    maintenance:
      name: bldemat-${bundle.target}-maintenance
      description: Clôture des brouillons et exécutions interrompues
      run_as:
        service_principal_name: ${var.jobs_service_principal}
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 15 2 * * ?"
        timezone_id: Europe/Paris
        pause_status: UNPAUSED
      tasks:
        - task_key: maintenance
          spark_python_task:
            python_file: ./jobs/maintenance.py
            parameters:
              - --pg-host
              - ${var.pg_host}
              - --pg-database
              - ${var.pg_database}
              - --pg-schema
              - ${var.pg_schema}
              - --lakebase-endpoint
              - ${var.lakebase_endpoint}
              - --pg-user
              - ${var.jobs_service_principal}
              - --draft-hours
              - "24"
              - --stale-job-hours
              - "6"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "4"
            dependencies:
              - psycopg[binary]==3.2.3
              - databricks-sdk>=0.89.0,<1
      permissions:
        - group_name: ${var.administrators_group}
          level: CAN_MANAGE

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
  rec:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
