services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bldemat
      POSTGRES_USER: bldemat_owner
      POSTGRES_PASSWORD: local-only-change-me
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bldemat_owner -d bldemat"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - bldemat-postgres:/var/lib/postgresql/data

volumes:
  bldemat-postgres:
