[project]
name = "bldemat"
version = "5.0.0"
description = "Dématérialisation professionnelle des bordereaux de livraison sur Databricks"
requires-python = ">=3.11,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --disable-warnings"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["src/app_creation/bl_core", "src/app_administration/bl_core"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["E501"]
