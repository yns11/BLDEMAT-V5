command: ["streamlit", "run", "app.py", "--server.headless=true"]
env:
  - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
    value: "false"
  - name: BL_RBAC_MODE
    value: "strict"
  - name: BL_IMAGE_BACKEND
    value: "volume"
  - name: BL_PG_SCHEMA
    value: "bl_demat"
  - name: BL_TIMEZONE
    value: "Europe/Paris"
  - name: BL_MAX_IMAGE_BYTES
    value: "4194304"
  - name: BL_MAX_TOTAL_BYTES
    value: "52428800"
  - name: BL_MAX_PAGES
    value: "20"
  - name: BL_MAX_DIMENSION_PX
    value: "3508"
